<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neovixar</title>
    <meta
      name="description"
      content="Neovixar: разработка сайтов, Telegram-ботов и приложений. Контент загружается с neovixar.com"
    />
    <link rel="canonical" href="https://neovixar.com/" />

    <meta name="apple-mobile-web-app-title" content="Neovixar" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="manifest" href="/swensiteam/site.webmanifest?v=nv2" />

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      #nv-mirror {
        display: block;
        width: 100%;
        height: 100%;

      #nv-fallback {
        display: none;
        margin: 0;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e8e8e8;
        text-align: center;
        padding: 1.5rem;
      }
      #nv-fallback a {
        color: #0ae448;
      }
    </style>
  </head>
  <body>
    <iframe
      id="nv-mirror"
      src="https://neovixar.com/"
      title="Neovixar"
      referrerpolicy="no-referrer-when-downgrade"
      allow="fullscreen"
    ></iframe>
    <p id="nv-fallback">
      Не удалось загрузить зеркало.
      <a href="https://neovixar.com/">Открыть neovixar.com</a>
    </p>
    <script type="module" src="./index.tsx"></script>
