<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aileader dev</title>
    <link rel="icon" type="image/png" href="/swensiteam/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"CA Saygon Text"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"CA Saygon Text"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      /* UI body — same as NEOLEX (CA Saygon Text). Helony only for hero wordmark. */
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Thin.woff2") format("woff2");
        font-weight: 100;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Light.woff2") format("woff2");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Semibold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "CA Saygon Text";
        src: url("/swensiteam/fonts/saygon/CASaygonText-Extrabold.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Helony';
        src: url('/swensiteam/Helony.otf') format('opentype');
        /* One Regular file — map full weight range so font-bold does NOT synthetic-embolden */
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      body {
        font-family: "CA Saygon Text", ui-sans-serif, system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      /* Keep section counters / labels on Saygon too (was Inter + system mono) */
      .font-mono,
      .aw-mono {
        font-family: "CA Saygon Text", ui-sans-serif, system-ui, sans-serif !important;
      }

      /* —— Unified black / white theme tokens —— */
      :root {
        --bg: #f6f6f4;
        --fg: #0a0a0a;
        --muted: rgba(10, 10, 10, 0.62);
        --line: rgba(10, 10, 10, 0.14);
        --accent: #0a0a0a;
        --accent-inv: #ffffff;
        --surface: #ffffff;
        --surface-2: #ecece8;
        --surface-3: #e2e2de;
        --surface-4: #d6d6d2;
        --glass-bg: rgba(255, 255, 255, 0.72);
        --glass-inset: rgba(255, 255, 255, 0.55);
        --glass-a: rgba(0, 0, 0, 0.18);
        --glass-b: rgba(0, 0, 0, 0.06);
        --hero-nav-bg: rgba(255, 255, 255, 0.78);
        --hero-nav-fg: #0a0a0a;
      }
      html.dark {
        --bg: #050505;
        --fg: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.68);
        --line: rgba(255, 255, 255, 0.14);
        --accent: #ffffff;
        --accent-inv: #0a0a0a;
        --surface: #121212;
        --surface-2: #1a1a1a;
        --surface-3: #222222;
        --surface-4: #2a2a2a;
        --glass-bg: rgba(18, 18, 18, 0.58);
        --glass-inset: rgba(255, 255, 255, 0.12);
        --glass-a: rgba(255, 255, 255, 0.4);
        --glass-b: rgba(255, 255, 255, 0.12);
        --hero-nav-bg: rgba(0, 0, 0, 0.52);
        --hero-nav-fg: #ffffff;
      }

      /* Text selection — soft tint, never solid black bars */
      ::selection {
        background: rgba(10, 10, 10, 0.16) !important;
        color: #0a0a0a !important;
      }
      ::-moz-selection {
        background: rgba(10, 10, 10, 0.16) !important;
        color: #0a0a0a !important;
      }
      html.dark ::selection {
        background: rgba(255, 255, 255, 0.22) !important;
        color: #fff !important;
      }
      html.dark ::-moz-selection {
        background: rgba(255, 255, 255, 0.22) !important;
        color: #fff !important;
      }
      .aw-card__art,
      .aw-card__art img {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Custom scrollbar for that premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-2);
      }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--fg) 35%, transparent);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: color-mix(in srgb, var(--fg) 55%, transparent);
      }
      .honey-text-outline {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
        color: transparent;
      }
      /* Hide scrollbar for touch swipe */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Liquid glass — readable B/W */
      .liquid-glass {
        background: var(--glass-bg);
        background-blend-mode: normal;
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        border: 1px solid var(--line) !important;
        box-shadow: inset 0 1px 0 var(--glass-inset), 0 8px 28px rgba(0,0,0,0.12);
        position: relative;
        overflow: hidden;
        color: var(--fg);
      }
      /* Nav must allow language dropdown to escape */
      header.fixed nav.liquid-glass {
        overflow: visible !important;
      }
      .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(180deg,
          var(--glass-a) 0%, var(--glass-b) 35%,
          transparent 55%, var(--glass-b) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Fixed header: follows light / dark theme over hero */
      header.fixed .liquid-glass,
      div.liquid-glass.fixed {
        background: var(--hero-nav-bg) !important;
        color: var(--hero-nav-fg) !important;
        border-color: color-mix(in srgb, var(--hero-nav-fg) 22%, transparent) !important;
        box-shadow: inset 0 1px 0 color-mix(in srgb, var(--hero-nav-fg) 14%, transparent), 0 10px 30px rgba(0,0,0,0.22);
      }
      header.fixed .liquid-glass a,
      header.fixed .liquid-glass button,
      header.fixed .liquid-glass span,
      div.liquid-glass.fixed a,
      div.liquid-glass.fixed button,
      div.liquid-glass.fixed span,
      header.fixed nav a {
        color: var(--hero-nav-fg) !important;
      }
      header.fixed nav .aileader-lang-menu,
      header.fixed nav .aileader-lang-menu * {
        color: inherit;
      }
      header.fixed nav .aileader-lang-menu button {
        color: rgba(255, 255, 255, 0.8) !important;
      }
      header.fixed nav .aileader-lang-menu button:hover {
        color: #fff !important;
        background: rgba(255, 255, 255, 0.1) !important;
      }
      header.fixed nav a:hover {
        opacity: 0.85;
      }
      /* Active nav pill must stay a soft chip — never a solid black block */
      header.fixed nav a > div.absolute {
        background: color-mix(in srgb, var(--hero-nav-fg) 12%, transparent) !important;
      }
      html.dark header.fixed nav a > div.absolute {
        background: rgba(255, 255, 255, 0.92) !important;
      }
      html.dark header.fixed nav a > div.absolute + span {
        color: #050505 !important;
      }

      /* Theme toggle: never white-on-white / black-on-black on hover */
      header.fixed nav button.aileader-theme-btn {
        color: var(--hero-nav-fg) !important;
        background: transparent !important;
      }
      header.fixed nav button.aileader-theme-btn svg {
        color: inherit !important;
        fill: currentColor !important;
      }
      html:not(.dark) header.fixed nav button.aileader-theme-btn:hover {
        background: #0a0a0a !important;
        color: #ffffff !important;
        border-color: #0a0a0a !important;
      }
      html.dark header.fixed nav button.aileader-theme-btn:hover {
        background: #ffffff !important;
        color: #050505 !important;
        border-color: #ffffff !important;
      }

      /* Language menu above glass / hero */
      header.fixed .aileader-lang-menu {
        z-index: 80 !important;
      }
      header.fixed .aileader-lang-btn {
        position: relative;
        z-index: 2;
      }
      header.fixed nav .ml-2.relative {
        z-index: 70;
      }

      /* Hero background + theme-aware overlays / titles */
      #aileader-hero-shader {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #050505 url("/swensiteam/hero-back.webp") center / cover no-repeat;
        transition: filter 0.35s ease, opacity 0.35s ease;
      }
      html:not(.dark) #aileader-hero-shader {
        filter: brightness(1.4) saturate(0.3) contrast(0.9);
        opacity: 0.5;
      }
      html:not(.dark) section:has(#aileader-hero-shader) {
        background: #f6f6f4 !important;
      }
      html:not(.dark) section:has(#aileader-hero-shader) .bg-\[\#050505\]\/35 {
        background: rgba(246, 246, 244, 0.58) !important;
      }
      section:has(#aileader-hero-shader) h1 span,
      .hero-logo__title span {
        color: #fff !important;
        text-shadow: 0 2px 28px rgba(0,0,0,0.5);
      }
      section:has(#aileader-hero-shader) h1 span:first-child,
      .hero-logo__title span:first-child {
        color: rgba(255,255,255,0.88) !important;
      }
      html:not(.dark) section:has(#aileader-hero-shader) h1 span,
      html:not(.dark) section:has(#aileader-hero-shader) h1 span:first-child,
      html:not(.dark) .hero-logo__title span,
      html:not(.dark) .hero-logo__title span:first-child {
        color: #0a0a0a !important;
        text-shadow: none;
      }
      section:has(#aileader-hero-shader) p.text-white\/60,
      .hero-sub {
        color: rgba(255,255,255,0.8) !important;
        text-shadow: 0 1px 12px rgba(0,0,0,0.4);
      }
      html:not(.dark) section:has(#aileader-hero-shader) p.text-white\/60,
      html:not(.dark) .hero-sub {
        color: rgba(10,10,10,0.7) !important;
        text-shadow: none;
      }

      /* —— Hero stack: ONE source of spacing (no padding/margin/gap fights) —— */
      .hero-stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        padding: 0 1.5rem;
        gap: 2rem; /* logo → sub → CTA, equal rhythm */
        box-sizing: border-box;
      }
      .hero-logo {
        margin: 0;
        padding: 0;
        line-height: 0; /* collapse wrapper; title owns its box */
      }
      .hero-logo__title {
        margin: 0;
        padding: 0;
        font-family: Helony, sans-serif;
        font-weight: 400;
        font-size: clamp(3rem, 12vw, 8rem);
        line-height: 1;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-align: center;
      }
      .hero-sub {
        margin: 0 !important;
        padding: 0;
        max-width: 32rem;
        text-align: center;
        font-size: clamp(0.875rem, 1.6vw, 1.125rem);
        line-height: 1.45;
        font-weight: 400;
      }
      .hero-cta {
        margin: 0;
      }
      @media (max-width: 768px) {
        #aileader-hero-shader {
          background-image: url("/swensiteam/hero-back-mob.webp");
        }
        .hero-stack {
          gap: 1.5rem;
        }
      }

      /* —— Why AILeader — blue feature cards (reference style) —— */
      .aw-section {
        position: relative;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "CA Saygon Text", ui-sans-serif, system-ui, sans-serif;
        padding: clamp(2.75rem, 5.5vw, 5rem) 0 clamp(3.25rem, 6.5vw, 5.5rem);
        border-top: 1px solid var(--line);
        box-sizing: border-box;
      }
      .aw-inner {
        width: 100%;
        margin: 0;
        padding: 0 1.5rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }
      @media (min-width: 768px) {
        .aw-inner { padding: 0 3rem; gap: 2rem; }
      }
      .aw-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .aw-mono {
        font-family: "CA Saygon Text", ui-sans-serif, system-ui, sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #6e6f6c;
      }
      html.dark .aw-mono { color: #525252; }
      .aw-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
      }
      .aw-label {
        margin: 0 0 0.55rem;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6e6f6c;
      }
      html.dark .aw-label { color: #737373; }
      .aw-title {
        margin: 0;
        font-size: clamp(2.1rem, 4.8vw, 3.55rem);
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.05;
        color: var(--fg);
      }
      .aw-big--head {
        flex-shrink: 0;
        font-size: clamp(4rem, 8vw, 6.5rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 0.85;
        color: color-mix(in srgb, var(--fg) 14%, transparent);
        user-select: none;
        pointer-events: none;
      }
      .aw-rule {
        width: 100%;
        height: 1px;
        background: var(--line);
        margin: 0.15rem 0 0.5rem;
      }
      .aw-cols {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        align-items: stretch;
      }
      @media (min-width: 720px) {
        .aw-cols { grid-template-columns: 1fr 1fr; gap: 1.35rem; }
      }
      @media (min-width: 1100px) {
        .aw-cols {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 1.25rem;
        }
      }
      .aw-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 1.05rem;
        padding: 1.45rem 1.3rem 1.2rem;
        border-radius: 28px;
        box-sizing: border-box;
        min-height: 520px;
        overflow: hidden;
        color: var(--fg);
        /* liquid glass like top bar — bubbly, not blue */
        background: var(--hero-nav-bg);
        backdrop-filter: blur(16px) saturate(1.15);
        -webkit-backdrop-filter: blur(16px) saturate(1.15);
        border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--fg) 14%, transparent),
          0 12px 36px rgba(0, 0, 0, 0.16);
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      }
      .aw-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          165deg,
          var(--glass-a) 0%,
          var(--glass-b) 28%,
          transparent 52%,
          var(--glass-b) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: 0;
      }
      .aw-card > * {
        position: relative;
        z-index: 1;
      }
      html.dark .aw-card {
        background: rgba(12, 12, 12, 0.55);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 16px 40px rgba(0, 0, 0, 0.45);
      }
      html:not(.dark) .aw-card {
        background: rgba(255, 255, 255, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.7),
          0 14px 36px rgba(0, 0, 0, 0.08);
      }
      .aw-card:hover {
        transform: translateY(-4px);
        border-color: color-mix(in srgb, var(--fg) 28%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--fg) 18%, transparent),
          0 18px 44px rgba(0, 0, 0, 0.22);
      }
      .aw-card--art-top {
        justify-content: flex-start;
      }
      .aw-card--art-bottom {
        justify-content: flex-start;
      }
      .aw-card__copy {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      .aw-card--art-top .aw-card__copy {
        margin-top: auto;
      }
      .aw-card--art-top .aw-card__title {
        order: 2;
      }
      .aw-card--art-top .aw-card__text {
        order: 1;
      }
      .aw-card__title {
        margin: 0;
        font-size: clamp(1.45rem, 1.8vw, 1.75rem);
        font-weight: 750;
        letter-spacing: -0.035em;
        line-height: 1.15;
        color: var(--fg);
      }
      .aw-card__text {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.45;
        color: var(--muted);
        max-width: 28ch;
      }
      .aw-card__actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0.15rem 0;
      }
      .aw-card__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.55rem 1.05rem;
        border-radius: 999px;
        border: 1.5px solid color-mix(in srgb, var(--fg) 55%, transparent);
        color: var(--fg);
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .aw-card__btn:hover {
        background: var(--fg);
        color: var(--accent-inv);
        border-color: var(--fg);
      }
      .aw-card__go {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--fg);
        text-decoration: none;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent);
        background: color-mix(in srgb, var(--fg) 5%, transparent);
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .aw-card__go:hover {
        transform: translateX(3px);
        background: color-mix(in srgb, var(--fg) 10%, transparent);
      }
      .aw-card__art {
        width: 100%;
        aspect-ratio: 1 / 1;
        max-height: 240px;
        margin-top: auto;
        border-radius: 22px;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      .aw-card--art-top .aw-card__art {
        margin-top: 0;
        margin-bottom: 0.15rem;
      }
      .aw-card__art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
        background: transparent !important;
        filter: drop-shadow(0 10px 20px rgba(10, 10, 10, 0.14));
      }
      /* AI Systems + Delivery (art-bottom): robot a bit larger */
      .aw-card--art-bottom .aw-card__art {
        max-height: 260px;
      }
      .aw-card--art-bottom .aw-card__art img {
        transform: scale(1.14);
        transform-origin: center center;
      }
      html.dark .aw-card__art img {
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
      }
      .aw-card__dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.35rem;
        padding-top: 0.15rem;
      }
      .aw-card__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.5px solid color-mix(in srgb, var(--fg) 35%, transparent);
        background: transparent;
        box-sizing: border-box;
      }
      .aw-card__dot.is-on {
        background: var(--fg);
        border-color: var(--fg);
      }
      @media (max-width: 719px) {
        .aw-card { min-height: 460px; }
        .aw-card__art { max-height: 220px; }
        .aw-card--art-bottom .aw-card__art { max-height: 235px; }
      }
    </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25"
  }
